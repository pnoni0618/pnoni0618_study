<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="output"></div>

    <script>
      let i = 1;
      let result = '';

      while (i <= 10) {
        result += i + "<img src='./img/20251128_160933.png' width='60'>";
        i++;
      }

      document.getElementById('output').innerHTML = result;
    </script>
  </body>
</html>
