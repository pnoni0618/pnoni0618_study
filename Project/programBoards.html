<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>넷플릭스 게시판</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      #program-list button {
        margin-right: 8px;
      }
      #post-list > div {
        margin-bottom: 12px;
      }
      #write-form {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <!-- 프로그램 선택 영역 -->
    <h1>프로그램 선택</h1>
    <div id="program-list">
      <button data-program="physical">피지컬:아시아</button>
      <button data-program="iAmSolo">나는, 솔로</button>
    </div>

    <!-- 게시판 영역 -->
    <h2 id="board-title">게시판</h2>
    <div id="post-list">
      <!-- 글 목록이 들어감 -->
    </div>

    <!-- 글쓰기 버튼 -->
    <button id="write-btn">글쓰기</button>

    <!-- 글쓰기 폼 (처음엔 숨김) -->
    <div id="write-form" style="display: none">
      <input
        type="text"
        id="write-title"
        placeholder="제목을 입력하세요"
        style="display: block; width: 100%; margin-bottom: 8px; padding: 8px"
      />
      <textarea
        id="write-content"
        placeholder="내용을 입력하세요"
        rows="4"
        style="display: block; width: 100%; margin-bottom: 8px; padding: 8px"
      ></textarea>
      <button onclick="submitPost()">등록</button>
      <button onclick="cancelWrite()">취소</button>
    </div>

    <script>
      // 1) 프로그램별 게시글 데이터
      let boards = {
        // 프로그램별 게시판 데이터를 담아두는 통 (객체)
        physical: [
          // [배열 {key : value},{key : value}]
          // id, title, content-> 속성명(property)
          { id: 1, title: '1화 후기', content: '진짜 미쳤다... 근육들 실화냐' },
          { id: 2, title: '2화 관전 포인트', content: '팀전이 핵심인 듯!' },
        ],
        iAmSolo: [
          { id: 1, title: '출연진 케미 좋음', content: '시즌 꽤 재밌다' },
        ],
      };

      // ✅ localStorage에서 불러오기 (기본값과 "합치기" 방식)
      const savedBoards = localStorage.getItem('boards'); // localStorage에서 'boards'라는 값을 꺼내오는 함수

      if (savedBoards) {
        // saveBoards에 값이 있으면 실행
        try {
          // JSON.parsd()문자열을  객체/배열로 되돌리는 함수
          const parsed = JSON.parse(savedBoards);

          // boards의 기본 구조를 유지하면서,
          // localStorage에 있는 데이터만 덮어쓰기(merge)
          boards = {
            physical: Array.isArray(parsed.physical)
              ? parsed.physical
              : boards.physical,
            iAmSolo: Array.isArray(parsed.iAmSolo)
              ? parsed.iAmSolo
              : boards.iAmSolo,
          };
        } catch (e) {
          // JSON이 깨져있으면 기본값 유지
          // (아무 것도 안 함)
        }
      }

      // ✅ 저장 함수
      function saveBoards() {
        localStorage.setItem('boards', JSON.stringify(boards));
      }

      // 2) 화면에 보여줄 프로그램 이름
      const programNames = {
        physical: '피지컬: 아시아',
        iAmSolo: '나는 솔로',
      };

      // 3) 상태값 ("지금 화면이 어떤 상태인지" 저장)
      let currentProgram = 'physical';
      let isEditMode = false;
      let editingPostId = null;

      // 4) DOM 요소
      const programButtons = document.querySelectorAll('#program-list button');
      const boardTitle = document.getElementById('board-title');
      const postList = document.getElementById('post-list');
      const writeBtn = document.getElementById('write-btn');
      const writeForm = document.getElementById('write-form');
      const writeTitleInput = document.getElementById('write-title');
      const writeContentInput = document.getElementById('write-content');

      // 5) 게시판 그리기
      function renderBoard() {
        boardTitle.textContent = programNames[currentProgram] + ' 게시판';
        postList.innerHTML = '';

        const posts = boards[currentProgram];

        if (!posts || posts.length === 0) {
          postList.innerHTML = '<p>아직 글이 없습니다.</p>';
          return;
        }

        posts.forEach((post) => {
          const div = document.createElement('div');
          div.innerHTML = `
        <h3>${post.title}</h3>
        <p>${post.content}</p>
        <button onclick="editPost(${post.id})">수정</button>
        <button onclick="deletePost(${post.id})">삭제</button>
        <hr>
      `;
          postList.appendChild(div);
        });
      }

      // 6) 글쓰기 폼 열기
      function handleWrite() {
        // 새 글 쓰기 모드로 전환
        isEditMode = false;
        editingPostId = null;

        writeForm.style.display = 'block';
        writeTitleInput.value = '';
        writeContentInput.value = '';
        writeTitleInput.focus();
      }

      // 7) 등록(새 글 추가 / 수정 완료)
      function submitPost() {
        const title = writeTitleInput.value.trim();
        const content = writeContentInput.value.trim();

        if (!title) {
          alert('제목을 입력하세요');
          writeTitleInput.focus();
          return;
        }
        if (!content) {
          alert('내용을 입력하세요');
          writeContentInput.focus();
          return;
        }

        const posts = boards[currentProgram];

        // ✅ 수정 모드
        if (isEditMode && editingPostId !== null) {
          const target = posts.find((post) => post.id === editingPostId);
          if (!target) return;

          target.title = title;
          target.content = content;

          isEditMode = false;
          editingPostId = null;
        }
        // ✅ 새 글 등록
        else {
          const newId = posts.length > 0 ? posts[posts.length - 1].id + 1 : 1;
          posts.push({ id: newId, title, content });
        }

        saveBoards();
        renderBoard();

        writeForm.style.display = 'none';
        writeTitleInput.value = '';
        writeContentInput.value = '';
      }

      // 8) 취소
      function cancelWrite() {
        writeForm.style.display = 'none';
        writeTitleInput.value = '';
        writeContentInput.value = '';

        isEditMode = false;
        editingPostId = null;
      }

      // 9) 삭제
      function deletePost(id) {
        const posts = boards[currentProgram];
        const index = posts.findIndex((post) => post.id === id);

        if (index !== -1) {
          posts.splice(index, 1);
          saveBoards();
          renderBoard();
        }
      }

      // 10) 수정 시작
      function editPost(id) {
        const posts = boards[currentProgram];
        const target = posts.find((post) => post.id === id);
        if (!target) return;

        isEditMode = true;
        editingPostId = id;

        writeForm.style.display = 'block';
        writeTitleInput.value = target.title;
        writeContentInput.value = target.content;
        writeTitleInput.focus();
      }

      // 11) 이벤트 연결
      writeBtn.addEventListener('click', handleWrite);

      programButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          currentProgram = btn.dataset.program;
          console.log('버튼 클릭됨:', currentProgram);
          // 프로그램 바꿀 때 수정/작성 폼은 닫아주기(안정)
          cancelWrite();
          renderBoard();
        });
      });

      // 12) 첫 화면 렌더
      renderBoard();
      console.log(currentProgram);
      console.log(boards[currentProgram]);
    </script>
  </body>
</html>
