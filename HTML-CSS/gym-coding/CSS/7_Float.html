<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float</title>
  </head>
  <style>
    .container {
      width: 800px;
      border: 1px solid grey;
    }
    img {
      width: 400px;
    }

    .float-left {
      float: left;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .float-right {
      float: right;
    }

    p {
      border: 1px solid blue;
    }

    .clear {
      clear: both;
    }
  </style>
  <body>
    <div class="container">
      <img class="float-left" src="../assets/1666673.jpg" alt="" />
      <p>
        이 사진은 벨기에 브뤼헤의 운하를 따라 늘어선 건물과 종탑의 풍경입니다.
        브뤼헤는 '북쪽의 베네치아'라고 불리며, 도시 전체가 유네스코
        세계문화유산으로 지정되어 있습니다.
      </p>
      <p class="clear">
        이 사진은 벨기에 브뤼헤의 운하를 따라 늘어선 건물과 종탑의 풍경입니다.
        브뤼헤는 '북쪽의 베네치아'라고 불리며, 도시 전체가 유네스코
        세계문화유산으로 지정되어 있습니다.
      </p>

  </body>
</html>
