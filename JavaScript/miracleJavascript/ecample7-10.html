<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사용자 객체 선언 및 사용하기</title>
  </head>
  <body>
    <div id="intro"></div>
    <script>
      const intro = document.getElementById('intro');

      function Person(name, age) {
        this.name = name;
        this.age = age;
        this.showIntro = function () {
          intro.innerHTML += `My name is ${this.name}, my age is ${this.age}.<hr>`;
        };
      }

      let person1 = new Person('cho', 23);
      let person2 = new Person('kim', 24);

      person1.showIntro();
      person2.showIntro();
    </script>
  </body>
</html>
