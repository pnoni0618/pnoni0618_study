<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>날짜 계산기</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }

      .input-column {
        width: 250px;
        margin-bottom: 20px;
      }

      .input-column input,
      .input-column button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 16px;
        margin-bottom: 8px;
      }

      button {
        border: 1px solid #ccc;
        background: #f5f5f5;
        cursor: pointer;
      }
      button:hover {
        background: #e3e3e3;
      }
    </style>
  </head>
  <body>
    <h2>궁금한 날짜를 입력하세요:</h2>

    <div class="input-column">
      <input type="number" id="year" placeholder="년" />
      <input type="number" id="month" placeholder="월" />
      <input type="number" id="day" placeholder="일" />
      <button onclick="calculateDays()">계산</button>
    </div>

    <p id="today"></p>
    <p id="result"></p>

    <script>
      function calculateDays() {
        const year = parseInt(document.getElementById('year').value); // 입력값 문자열-> 숫자로 변환
        const month = parseInt(document.getElementById('month').value);
        const day = parseInt(document.getElementById('day').value);

        const today = new Date(); // 현재 날짜와 시간을 가진 Date 객체 생성
        const inputDate = new Date(year, month - 1, day); // 사용자가 입력한 날짜 만들기, Date는 month가 0부터 시작하기 때문에 month-1을 해야함

        const timeDiff = today - inputDate; // 두 날짜 차이를 "밀리초"로 계산
        const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24)); // 밀리초 -> 초-> 분-> 시간 -> 일 최종 며칠 차이인지 계산

        // 오늘 날짜 출력
        document.getElementById(
          'today'
        ).innerHTML = `오늘 날짜 : ${today.toLocaleDateString()}`;

        // 결과 출력
        if (daysDiff > 0) {
          document.getElementById('result').innerHTML = `${daysDiff}일 전`;
        } else if (daysDiff < 0) {
          document.getElementById('result').innerHTML = `${-daysDiff}일 남았음`;
        } else {
          document.getElementById('result').innerHTML = `오늘입니다!`;
        }
      }
    </script>
  </body>
</html>
