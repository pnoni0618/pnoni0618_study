<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>넷플릭스 게시판 연습장</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }

      #program-list button {
        margin-right: 8px;
      }

      #post-list > div {
        margin-bottom: 16px;
      }

      #write-form {
        margin-top: 16px;
      }
    </style>
  </head>

  <body>
    <!-- 프로그램 선택 영역 -->
    <h1>프로그램 선택</h1>
    <div id="program-list">
      <button data-program="physical">피지컬: 아시아</button>
      <button data-program="iAmSolo">나는, 솔로</button>
    </div>

    <!-- 게시판 영역 -->
    <h2 id="board-title">게시판</h2>
    <div id="post-list">
      <!-- 글 목록이 들어감-->
    </div>

    <!-- 글쓰기 버튼-->
    <button id="write-btn">글쓰기</button>

    <!-- 글쓰끼 폼 (처음엔 숨김)-->
    <div id="write-form" style="display: none">
      <input
        type="text"
        id="write-title"
        placeholder="제목을 입력하세요"
        style="display: block; width: 100%; margin-bottom: 8px; padding: 8px"
      />
      <textarea
        id="write-content"
        placeholder="내용을 입력하세요"
        rows="4"
        style="display: block; width: 100%; margin-bottom: 8px; padding: 8px"
      ></textarea>
      <button onclick="submitPost()">등록</button>
      <button onclick="cancleWrite()">취소</button>
    </div>
  </body>
</html>
