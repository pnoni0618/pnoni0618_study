<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      .container-rpc {
        border: 1px solid red;
        display: flex;

        flex-wrap: wrap; /* 줄바꿈 허용 */
        justify-content: space-between; /* 양끝 배치 */
      }

      .container-rpc > div {
        border: 1px solid blue;
        padding: 10px;
        margin: 10px;
        height: 300px;
        width: 200px;
        display: flex;
        flex-direction: column; /* 자식 요소들을 세로로 배치 */
      }

      .container-rpc > div > #myRpcImg,
      #youRpcImg {
        /* border: 1px solid blue; */
        width: 100px;
        margin-top: auto; /* 아래쪽으로 밀어내기 */
      }
      .container-rpc img {
        width: 100px;
      }

      #resultP {
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container-rpc">
      <div>
        <h1>나</h1>
        <p>
          <input type="radio" name="rpc" id="rock" value="0" />
          <label for="rock">가위</label>
          <input type="radio" name="rpc" id="paper" value="1" />
          <label for="paper">바위</label>
          <input type="radio" name="rpc" id="scissors" value="2" />
          <label for="scissors">보</label>
        </p>
        <hr />
        <button id="gogosingButton" data-status="ing">스탑ㅋㅋ</button>
        <div id="myRpcImg"></div>
      </div>
      <div>
        <h1>상대방</h1>
        <div id="youRpcImg"></div>
      </div>
    </div>
    <p id="resultP"></p>
    <!-- Code injected by live-server -->
    <script type="text/javascript">
      // <![CDATA[  <-- For SVG support
      if ('WebSocket' in window) {
        (function () {
          function refreshCSS() {
            var sheets = [].slice.call(document.getElementsByTagName('link'));
            var head = document.getElementsByTagName('head')[0];
            for (var i = 0; i < sheets.length; ++i) {
              var elem = sheets[i];
              head.removeChild(elem);
              var rel = elem.rel;
              if (
                (elem.href && typeof rel != 'string') ||
                rel.length == 0 ||
                rel.toLowerCase() == 'stylesheet'
              ) {
                var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
                elem.href =
                  url +
                  (url.indexOf('?') >= 0 ? '&' : '?') +
                  '_cacheOverride=' +
                  new Date().valueOf();
              }
              head.appendChild(elem);
            }
          }
          var protocol =
            window.location.protocol === 'http:' ? 'ws://' : 'wss://';
          var address =
            protocol + window.location.host + window.location.pathname + '/ws';
          var socket = new WebSocket(address);
          socket.onmessage = function (msg) {
            if (msg.data == 'reload') window.location.reload();
            else if (msg.data == 'refreshcss') refreshCSS();
          };
          console.log('Live reload enabled.');
        })();
      }
      // ]]>
    </script>
  </body>

  <script>
    const imageObject = {
      0: 'https://thumb.silhouette-ac.com/t/a7/a7c3020b4cfb4fd154c4fcfd62702df2_t.jpeg', // 가위
      1: 'https://thumb.silhouette-ac.com/t/69/69ffced83032519ca680dc3058b9ca26_t.jpeg', // 바위
      2: 'https://thumb.silhouette-ac.com/t/ac/ace4c56ba1582e3a3c6ed4a3b20ec7a9_t.jpeg', // 보
    };

    let yourResult = 0;

    const resultP = document.getElementById('resultP');
    const stop = (myResult) => {
      clearInterval(timer1); // fn1 멈춤
      // 결과출력

      console.log(myResult, yourResult);
      if (myResult === yourResult) {
        resultP.textContent = '비겼습니다.';
      } else {
        if (myResult === 0) {
          resultP.textContent =
            yourResult === 2 ? '이겼습니다.' : '개발렸습니다.';
        } else if (myResult === 1) {
          resultP.textContent =
            yourResult === 0 ? '이겼습니다.' : '개발렸습니다.';
        } else if (myResult === 2) {
          resultP.textContent =
            yourResult === 0 ? '개발렸습니다.' : '이겼습니다.';
        }
      }
    };

    const disp = () => {
      const timeStamp = new Date().getTime();
      yourResult = timeStamp % 3;
      document.getElementById(
        'youRpcImg'
      ).innerHTML = `<img src=${imageObject[yourResult]} />`;
    };

    let timer1 = setInterval(disp, 100);

    const gogosingButton = document.getElementById('gogosingButton');

    const rpcRadios = document.querySelectorAll('input[name="rpc"]');

    rpcRadios.forEach((radio) => {
      radio.addEventListener('change', (e) => {
        document.getElementById('myRpcImg').innerHTML = `<img src=${
          imageObject[e.target.value]
        } />`;
      });
    });

    const gogosingHamsoo = () => {
      if (gogosingButton.dataset.status === 'ing') {
        const checkedRadio = document.querySelector(
          'input[name="rpc"]:checked'
        );
        if (!checkedRadio) {
          alert('무엇을 낼지 선택은 하거라..');
          return false;
        }

        // 나
        const myResult = Number(checkedRadio.value);
        stop(myResult);

        gogosingButton.dataset.status = 'stop';
        gogosingButton.textContent = '고고싱';
      } else {
        gogosingButton.textContent = '스탑ㅋㅋ';
        gogosingButton.dataset.status = 'ing';
        timer1 = setInterval(disp, 100);
        resultP.textContent = '';
        document.getElementById('myRpcImg').innerHTML = '';
      }

      rpcRadios.forEach((radio) => {
        radio.checked = false;
      });
    };

    gogosingButton.addEventListener('click', gogosingHamsoo);
  </script>
</html>
